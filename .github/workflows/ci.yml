name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_STACK_NO_UPDATE_NOTIFIER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Provenance reads HEAD and its symbolic branch, without history traversal.
          fetch-depth: 1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Sync test environment
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          mkdir -p experiments/ci
      - name: Install native GitHub stack tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.102.0 --repo cli/cli --pattern gh_2.102.0_linux_amd64.tar.gz --dir "$RUNNER_TEMP/gh-download"
          echo 'bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  '"$RUNNER_TEMP/gh-download/gh_2.102.0_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gh-download/gh_2.102.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          gh_bin="$RUNNER_TEMP/gh_2.102.0_linux_amd64/bin"
          echo "$gh_bin" >> "$GITHUB_PATH"
          stack_dir="$RUNNER_TEMP/gh-stack"
          mkdir -p "$stack_dir"
          gh release download v0.2.0 --repo github/gh-stack --pattern linux-amd64 --dir "$stack_dir"
          echo '577065033b49d4505730ea0ad43ab1b0374b0d9b1308e9765647a6aa8eba3cb7  '"$stack_dir/linux-amd64" | sha256sum --check
          mv "$stack_dir/linux-amd64" "$stack_dir/gh-stack"
          chmod +x "$stack_dir/gh-stack"
          cd "$stack_dir"
          "$gh_bin/gh" extension install .
      - name: Check required capabilities
        id: capabilities
        run: |
          git --version
          gh --version
          gh stack --version
          python3 -c 'import sys, hatchling; assert sys.version_info[:2] == (3, 13), sys.version'
      - name: Core tests
        run: uv run --locked python run_tests.py --jobs 4 --json-report experiments/ci/core.json
      - name: Skill tests
        if: ${{ !cancelled() && steps.capabilities.outcome == 'success' }}
        run: uv run --locked python run_tests.py --start-directory agent-skills/tests --jobs 4 --json-report experiments/ci/skills.json
      - name: Build distributions
        if: ${{ !cancelled() && steps.capabilities.outcome == 'success' }}
        run: uv build --no-build-isolation --python .venv/bin/python
      - name: Check required executed tests
        if: ${{ !cancelled() && steps.capabilities.outcome == 'success' }}
        run: uv run --locked python check_ci_reports.py experiments/ci
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: experiments/ci/*.json
          if-no-files-found: error
          retention-days: 7
